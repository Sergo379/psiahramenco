name: Build Ticket Studio
on:
  push:
    branches: [main, master, lab2-ui-tickets]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/ExamTicketGenerator.Tests/ExamTicketGenerator.Tests.csproj -p:UseSharedCompilation=false
      - name: Package
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TicketStudio-windows-x64
          path: dist/TicketStudio/
